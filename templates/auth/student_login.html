{% extends 'base.html' %}

{% block title %}Student Login{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-body">
        <h4 class="card-title">Student Login</h4>
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" value="{{ request.form.email }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">
            New student? <a href="{{ url_for('auth.register') }}">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
