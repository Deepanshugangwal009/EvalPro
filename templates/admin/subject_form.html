{% extends 'base.html' %}

{% block title %}{{ form_title }}{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-body">
        <h4 class="card-title">{{ form_title }}</h4>
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="subject_name">Subject Name</label>
                <input class="form-control" type="text" id="subject_name" name="subject_name" value="{{ subject.subject_name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="subject_code">Subject Code</label>
                <input class="form-control" type="text" id="subject_code" name="subject_code" value="{{ subject.subject_code }}" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Save</button>
        </form>
        <p class="text-center mt-3 mb-0">
            <a href="{{ url_for('admin.subjects') }}">Back to subjects</a>
        </p>
    </div>
</div>
{% endblock %}
