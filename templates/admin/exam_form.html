{% extends 'base.html' %}

{% block title %}{{ form_title }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h4 class="card-title">{{ form_title }}</h4>
        <form method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="exam_name">Exam Name</label>
                    <input class="form-control" type="text" id="exam_name" name="exam_name" value="{{ exam.exam_name }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="subject_id">Subject</label>
                    <select class="form-select" id="subject_id" name="subject_id" required>
                        <option value="">Select Subject</option>
                        {% for subject in subjects %}
                            <option value="{{ subject.subject_id }}" {% if exam.subject_id == subject.subject_id %}selected{% endif %}>
                                {{ subject.subject_name }} ({{ subject.subject_code }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="exam_date">Exam Date</label>
                    <input class="form-control" type="date" id="exam_date" name="exam_date" value="{{ exam.exam_date }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="start_time">Start Time</label>
                    <input class="form-control" type="time" id="start_time" name="start_time" value="{{ exam.start_time[:5] }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="end_time">End Time</label>
                    <input class="form-control" type="time" id="end_time" name="end_time" value="{{ exam.end_time[:5] }}" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="duration">Duration (minutes)</label>
                    <input class="form-control" type="number" id="duration" name="duration" min="1" value="{{ exam.duration }}" required>
                </div>
                <div class="col-md-4 mb-3 d-flex align-items-end">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if exam.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Exam is active</label>
                    </div>
                </div>
            </div>
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('admin.exams') }}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
