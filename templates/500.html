{% extends 'base.html' %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-body text-center">
        <h1 class="display-5">500</h1>
        <h5 class="mb-3">Something Went Wrong</h5>
        <p class="text-muted">The server could not complete your request. Please try again in a moment.</p>
        <a class="btn btn-primary" href="{{ url_for('home') }}">Go to Home</a>
    </div>
</div>
{% endblock %}
